name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"   # once a day
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate contribution snake (dark, cyan/teal palette)
        uses: Platane/snk@v3
        with:
          github_user_name: Alaamohamed2002
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=14B8A6,2DD4BF,2DD4BF,5EEAD4,99F6E4&color_dots=0B0F14,111827,134E4A,0F766E,14B8A6
            dist/github-contribution-grid-snake-dark.svg?color_snake=14B8A6,2DD4BF,2DD4BF,5EEAD4,99F6E4&color_dots=0B0F14,111827,134E4A,0F766E,14B8A6

      - name: Push generated SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
